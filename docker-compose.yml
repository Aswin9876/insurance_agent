version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://genailab.tcs.in}
      - LLM_MODEL=${LLM_MODEL:-azure_ai/genailab-maas-DeepSeek-V3-0324}
      - LLM_VERIFY_SSL=false
      - DATABASE_URL=sqlite:////app/backend/insurance.db
    volumes:
      - ./backend:/app/backend
    command: sh -c "python backend/seed.py && python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=demo-secret-change-me
    depends_on:
      - backend